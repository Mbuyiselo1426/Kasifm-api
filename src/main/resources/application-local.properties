# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Uses an in-memory H2 database so you can sanity-check the API before Docker/Postgres is set up.

spring.datasource.url=jdbc:h2:mem:kasiefm;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
