spring.application.name=kasie-fm-api

# Postgres connection - values come from environment variables (see docker-compose.yml)
# Defaults below let it also run against a local Postgres install.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kasiefm}
spring.datasource.username=${DB_USER:kasiefm}
spring.datasource.password=${DB_PASSWORD:kasiefm}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Required in production: a random 32+ character secret, never committed to source.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.dashboard-origin=${DASHBOARD_ORIGIN:http://localhost:8080}
app.bootstrap.username=${PRESENTER_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${PRESENTER_BOOTSTRAP_PASSWORD:}
app.bootstrap.display-name=${PRESENTER_BOOTSTRAP_DISPLAY_NAME:Presenter}
app.bootstrap.role=${PRESENTER_BOOTSTRAP_ROLE:PRESENTER}
