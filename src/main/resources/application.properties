spring.application.name=kasie-fm-api

# Postgres connection - values come from environment variables (see docker-compose.yml)
# Defaults below let it also run against a local Postgres install.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kasiefm}
spring.datasource.username=${DB_USER:kasiefm}
spring.datasource.password=${DB_PASSWORD:kasiefm}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
