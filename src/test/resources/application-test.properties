spring.datasource.url=jdbc:h2:mem:kasiefm-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.seed.enabled=false
app.jwt.secret=test-only-jwt-secret-must-be-at-least-32-bytes-long
app.jwt.expiration-seconds=3600
app.cors.dashboard-origin=http://localhost:8080
